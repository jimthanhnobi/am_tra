# Example only. Supply verified DNS, TLS certificates, private upstreams and
# TRUSTED_PROXY_IP (the actual proxy IP seen by the API) before deployment.
# Set PUBLIC_WEB_ORIGIN and NEXT_PUBLIC_SITE_URL to the verified HTTPS origin;
# build NEXT_PUBLIC_API_BASE_URL as https://<domain>/api/v1 for browser writes.
# Keep the API on a private network: this proxy owns the public HTTPS redirect,
# while the Next BFF reaches the API over private HTTP.
# Do not expose /api/v1/admin directly: browser Admin calls go through Next BFF.
upstream teapremium_web { server web:3000; }
upstream teapremium_api { server api:5080; }

server {
    listen 80;
    server_name example.invalid;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.invalid;
    ssl_certificate /etc/nginx/tls/site.crt;
    ssl_certificate_key /etc/nginx/tls/site.key;
    client_max_body_size 16m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;

    location ^~ /api/v1/admin/ { return 404; }
    location ^~ /api/v1/public/ {
        proxy_pass http://teapremium_api;
    }
    location ^~ /api/admin/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://teapremium_web;
    }
    location ^~ /admin/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://teapremium_web;
    }
    location = /admin {
        add_header Cache-Control "no-store" always;
        proxy_pass http://teapremium_web;
    }
    location / {
        proxy_pass http://teapremium_web;
    }
}
